<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location-Based AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Red box -->
        <a-entity gps-entity-place="latitude: 31.25145548262194; longitude: 131.07627721120593;" position="0 0 0">
            <a-box color="red" scale="10 10 10" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000;"></a-box>
        </a-entity>

        <a-sky color="#87CEEB"></a-sky>
    </a-scene>

    <div id="info">
        <p>位置情報: <span id="status">取得中...</span></p>
        <p>緯度: <span id="lat">-</span></p>
        <p>経度: <span id="lng">-</span></p>
    </div>

    <script>
        navigator.geolocation.watchPosition(function(position) {
            document.getElementById('lat').textContent = position.coords.latitude.toFixed(6);
            document.getElementById('lng').textContent = position.coords.longitude.toFixed(6);
            document.getElementById('status').textContent = '✓ 受信中';
        }, function(error) {
            document.getElementById('status').textContent = '✗ エラー';
        });
    </script>
</body>
</html>
