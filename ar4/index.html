<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Location-Based AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        a-scene {
            width: 100%;
            height: 100%;
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }
        #start-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a-scene 
        vr-mode-ui="enabled: false" 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;">
        
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Red box at fixed location -->
        <a-entity gps-entity-place="latitude: 31.25145548262194; longitude: 131.07627721120593;" position="0 0 0">
            <a-box 
                color="red" 
                scale="15 15 15"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000;">
            </a-box>
        </a-entity>

        <a-sky color="#87CEEB"></a-sky>
    </a-scene>

    <div id="info">
        <p>Status: <span id="status">-</span></p>
        <p>Latitude: <span id="lat">-</span></p>
        <p>Longitude: <span id="lng">-</span></p>
        <p>Accuracy: <span id="acc">-</span>m</p>
    </div>

    <button id="start-btn">Start AR</button>

    <script>
        let arStarted = false;

        document.getElementById('start-btn').addEventListener('click', function() {
            if (!arStarted) {
                startAR();
                this.textContent = 'AR Running';
                this.disabled = true;
                arStarted = true;
            }
        });

        function startAR() {
            // Request camera permission
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function(stream) {
                    console.log('Camera access granted');
                    document.getElementById('status').textContent = '✓ Camera OK';
                    startGPS();
                })
                .catch(function(error) {
                    console.error('Camera access denied:', error);
                    document.getElementById('status').textContent = '✗ Camera Denied';
                });
        }

        function startGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        document.getElementById('lat').textContent = lat.toFixed(6);
                        document.getElementById('lng').textContent = lng.toFixed(6);
                        document.getElementById('acc').textContent = Math.round(accuracy);
                        document.getElementById('status').textContent = '✓ GPS OK';
                    },
                    function(error) {
                        console.error('Geolocation error:', error);
                        document.getElementById('status').textContent = '✗ GPS Error';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        }
    </script>
</body>
</html>
