<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Location-Based AR with A-Frame and AR.js (v3.4.8)</title>
    
    <!-- A-Frame v1.3.0 (AR.js 3.4.8と確認済みの互換バージョン) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- AR.js v3.4.8 (最新版) -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/build/ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            max-width: 320px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        #info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffff;
        }

        #info-panel p {
            margin: 5px 0;
            line-height: 1.6;
        }

        .stat-label {
            color: #00ccff;
            font-weight: bold;
        }

        .stat-value {
            color: #ffff00;
        }

        .version-info {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #00ff00;
            font-size: 11px;
        }

        .status-good {
            color: #00ff00;
        }

        .status-warning {
            color: #ffaa00;
        }

        .status-error {
            color: #ff4444;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: rgba(0, 100, 200, 0.9);
            color: white;
            border: 2px solid #00ff00;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(0, 150, 255, 1);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #debug-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            display: none;
            border: 1px solid #00ff00;
        }

        .distance-info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #00ff00;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <!-- A-Frame Scene with AR.js (v3.4.8) -->
    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">

        <!-- GPS対応カメラ -->
        <a-camera
            gps-camera
            rotation-reader
            position="0 0 0">
        </a-camera>

        <!-- 環境光 -->
        <a-light type="ambient" intensity="1" color="#ffffff"></a-light>
        
        <!-- 指向性光源 -->
        <a-light 
            type="directional" 
            intensity="0.6" 
            position="5 10 7">
        </a-light>

        <!-- スカイボックス -->
        <a-sky color="#87CEEB"></a-sky>

        <!-- マーカー群 -->
        <a-entity id="marker-group">
            
            <!-- マーカー1: 回転キューブ -->
            <a-entity
                id="marker1"
                position="0 2 -10">
                <a-box
                    color="#FF4444"
                    width="1"
                    height="1"
                    depth="1"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
                </a-box>
                <a-text
                    value="M1"
                    position="0 1.8 0"
                    scale="1.5 1.5 1.5"
                    color="#FFFFFF"
                    align="center">
                </a-text>
            </a-entity>

            <!-- マーカー2: スケールアニメーション球体 -->
            <a-entity
                id="marker2"
                position="3 1.5 -8">
                <a-sphere
                    color="#44FF44"
                    radius="0.6"
                    animation="property: scale; to: 1.3 1.3 1.3; loop: true; dur: 2000; direction: alternate">
                </a-sphere>
                <a-text
                    value="M2"
                    position="0 1.2 0"
                    scale="1.5 1.5 1.5"
                    color="#FFFFFF"
                    align="center">
                </a-text>
            </a-entity>

            <!-- マーカー3: 移動アニメーション円柱 -->
            <a-entity
                id="marker3"
                position="-3 1 -8">
                <a-cylinder
                    color="#4444FF"
                    radius="0.4"
                    height="1.5"
                    animation="property: position; to: -3 1.5 -8; loop: true; dur: 2500; direction: alternate">
                </a-cylinder>
                <a-text
                    value="M3"
                    position="0 1.8 0"
                    scale="1.5 1.5 1.5"
                    color="#FFFFFF"
                    align="center">
                </a-text>
            </a-entity>

            <!-- マーカー4: 複合回転 -->
            <a-entity
                id="marker4"
                position="4 1.5 -5">
                <a-dodecahedron
                    color="#FFFF44"
                    radius="0.5"
                    animation="property: rotation; from: 0 0 0; to: 360 360 360; loop: true; dur: 3000">
                </a-dodecahedron>
                <a-text
                    value="M4"
                    position="0 1.2 0"
                    scale="1.5 1.5 1.5"
                    color="#FFFFFF"
                    align="center">
                </a-text>
            </a-entity>

            <!-- マーカー5: トーラス -->
            <a-entity
                id="marker5"
                position="-4 1.5 -5">
                <a-torus
                    color="#FF44FF"
                    arc="360"
                    radius="0.6"
                    radius-tubular="0.15"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
                </a-torus>
                <a-text
                    value="M5"
                    position="0 1.2 0"
                    scale="1.5 1.5 1.5"
                    color="#FFFFFF"
                    align="center">
                </a-text>
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- 情報パネル -->
    <div id="info-panel">
        <h3>📍 Location-Based AR</h3>
        
        <div class="version-info">
            <p><span class="stat-label">バージョン</span></p>
            <p style="margin-left: 10px;">
                A-Frame: <span class="stat-value">1.3.0</span>
            </p>
            <p style="margin-left: 10px;">
                AR.js: <span class="stat-value">3.4.8</span> ✓
            </p>
        </div>

        <p style="margin-top: 10px;"><span class="stat-label">GPS情報</span></p>
        <p style="margin-left: 10px;">
            緯度: <span class="stat-value" id="latitude">-</span>°
        </p>
        <p style="margin-left: 10px;">
            経度: <span class="stat-value" id="longitude">-</span>°
        </p>
        <p style="margin-left: 10px;">
            精度: <span class="stat-value" id="accuracy">-</span>m
        </p>
        <p style="margin-left: 10px;">
            高度: <span class="stat-value" id="altitude">-</span>m
        </p>

        <p style="margin-top: 8px;"><span class="stat-label">状態</span></p>
        <p id="status" style="margin-left: 10px;" class="status-warning">
            初期化中...
        </p>

        <div class="distance-info">
            <p><span class="stat-label">マーカー距離</span></p>
            <p id="distance-info" style="margin-left: 10px;">計算中...</p>
        </div>
    </div>

    <!-- デバッグ情報 -->
    <div id="debug-info">
        <p><strong>Debug Info</strong></p>
        <p id="debug-gps">GPS: 待機中</p>
        <p id="debug-accuracy">Accuracy: -</p>
        <p id="debug-heading">Heading: -</p>
    </div>

    <!-- コントロール -->
    <div id="controls">
        <button onclick="getCurrentLocation()">🔄 GPS取得</button>
        <button onclick="toggleDebugInfo()">🐛 デバッグ</button>
        <button onclick="resetMarkers()">🔃 リセット</button>
        <button onclick="toggleFullscreen()">⛶ FS</button>
    </div>

    <script>
        let gpsWatchID = null;
        let currentLocation = { lat: null, lng: null, accuracy: null };
        let debugEnabled = false;

        function getCurrentLocation() {
            if (navigator.geolocation) {
                updateStatus('GPS取得中...', 'warning');
                
                gpsWatchID = navigator.geolocation.watchPosition(
                    onLocationSuccess,
                    onLocationError,
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                updateStatus('GPS非対応', 'error');
            }
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const altitude = position.coords.altitude;
            const heading = position.coords.heading;

            currentLocation = { lat, lng, accuracy, altitude };

            document.getElementById('latitude').textContent = lat.toFixed(6);
            document.getElementById('longitude').textContent = lng.toFixed(6);
            document.getElementById('accuracy').textContent = Math.round(accuracy);
            document.getElementById('altitude').textContent = altitude ? altitude.toFixed(2) : 'N/A';

            document.getElementById('debug-gps').textContent = 
                `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('debug-accuracy').textContent = 
                `Accuracy: ±${Math.round(accuracy)}m`;
            document.getElementById('debug-heading').textContent = 
                `Heading: ${heading ? heading.toFixed(1) : 'N/A'}°`;

            updateStatus('GPS受信中 ✓', 'good');
            updateMarkerScale(accuracy);
            calculateDistances();
        }

        function onLocationError(error) {
            let message = 'GPS取得失敗';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = 'GPS許可拒否';
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = 'GPS利用不可';
                    break;
                case error.TIMEOUT:
                    message = 'GPS取得タイムアウト';
                    break;
            }
            updateStatus(message, 'error');
            console.error('Geolocation error:', error);
        }

        function updateMarkerScale(accuracy) {
            const scale = Math.max(0.5, 2 - accuracy / 500);
            const group = document.getElementById('marker-group');
            if (group) {
                group.setAttribute('scale', `${scale} ${scale} ${scale}`);
            }
        }

        function calculateDistances() {
            const markers = [
                { id: 'marker1', pos: { x: 0, y: 2, z: -10 } },
                { id: 'marker2', pos: { x: 3, y: 1.5, z: -8 } },
                { id: 'marker3', pos: { x: -3, y: 1, z: -8 } },
                { id: 'marker4', pos: { x: 4, y: 1.5, z: -5 } },
                { id: 'marker5', pos: { x: -4, y: 1.5, z: -5 } }
            ];

            let info = '';
            markers.forEach(m => {
                const dist = Math.sqrt(
                    m.pos.x ** 2 + m.pos.y ** 2 + m.pos.z ** 2
                ).toFixed(2);
                info += `${m.id}: ${dist}m<br>`;
            });
            document.getElementById('distance-info').innerHTML = info;
        }

        function updateStatus(message, type) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = `status-${type}`;
        }

        function toggleDebugInfo() {
            debugEnabled = !debugEnabled;
            document.getElementById('debug-info').style.display = 
                debugEnabled ? 'block' : 'none';
        }

        function resetMarkers() {
            ['marker1', 'marker2', 'marker3', 'marker4', 'marker5'].forEach(id => {
                const marker = document.getElementById(id);
                if (marker) {
                    marker.setAttribute('animation__reset',
                        'property: rotation; from: 0 0 0; to: 0 0 0; dur: 300');
                }
            });
            updateStatus('リセット完了', 'good');
        }

        function toggleFullscreen() {
            const scene = document.querySelector('a-scene');
            if (scene.requestFullscreen) {
                scene.requestFullscreen().catch(err => console.error(err));
            }
        }

        window.addEventListener('load', function() {
            console.log('A-Frame 1.3.0 & AR.js 3.4.8 loaded');
            getCurrentLocation();
            updateStatus('準備完了', 'good');
        });

        window.addEventListener('beforeunload', function() {
            if (gpsWatchID !== null) {
                navigator.geolocation.clearWatch(gpsWatchID);
            }
        });
    </script>
</body>
</html>
