<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foe's AR</title>

    <!-- 【変更】エラーの少ない最新の安定版ライブラリへ更新 -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- AR空間の定義（カメラの初期化など） -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- 【追加】マーカーの指定（標準のHIROマーカー） -->
        <a-marker preset="hiro">
            
            <!-- マーカー上に表示する3Dオブジェクト（青い立方体） -->
            <a-box position="0 0.5 0" material="color: #007bff; opacity: 0.8;" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
            
        </a-marker>

        <!-- AR用のカメラ -->
        
        
    </a-scene>

</body>
</html>
